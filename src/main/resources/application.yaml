server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: misfichas-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:developer}

  datasource:
    url: jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:2592000000}

admin:
  email: ${ADMIN_EMAIL}
  password: ${ADMIN_PASSWORD}

idempotency:
  ttl: ${IDEMPOTENCY_TTL:24h}
  max-entries: ${IDEMPOTENCY_MAX_ENTRIES:1000}

logging:
  level:
    org.hibernate.SQL: INFO